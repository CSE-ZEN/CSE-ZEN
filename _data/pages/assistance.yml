# Contenu de la page assistance-cse.html — modifié depuis l'espace d'édition (Decap CMS)
"seo":
  "titre": "CSE ZEN Assistance — rédaction de PV et comptes rendus CSE"
  "description": "CSE ZEN Assistance accompagne les secrétaires de CSE dans la rédaction de procès-verbaux et comptes rendus de réunions et commissions."
"s01":
  "f01": "Pôle assistance"
  "f02": "CSE ZEN Assistance, pour alléger le *quotidien de votre CSE*"
  "f03": "Après les réunions et commissions, la formalisation des échanges mobilise du temps et exige rigueur, clarté et fidélité. CSE ZEN Assistance prend en charge la rédaction de vos procès-verbaux et comptes rendus pour permettre au secrétaire et aux élus de se concentrer sur leur mandat."
  "f04": "Parler de votre besoin"
  "f05":
    "image": "https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?w=1400&q=90"
    "description": "Réunion de travail avec prise de notes"
"s02":
  "f01": "Un service opérationnel"
  "f02": "Vos réunions terminées, *nous prenons le relais*"
  "f03": "À partir de vos éléments de réunion, nous produisons un document structuré, lisible et adapté au niveau de restitution attendu."
  "c01":
    "f01": "01"
    "f02": "Procès-verbaux de réunions CSE"
    "f03": "Rédaction structurée des échanges, interventions, décisions et résolutions pour préparer un document exploitable par le secrétaire du CSE."
  "c02":
    "f01": "02"
    "f02": "Comptes rendus de commissions"
    "f03": "Formalisation claire des travaux des commissions : synthèse, points discutés, décisions et éléments à suivre."
  "c03":
    "f01": "03"
    "f02": "Plusieurs niveaux de restitution"
    "f03": "Compte rendu synthétique ou rédaction plus détaillée selon le besoin, le contexte de la réunion et les usages du CSE."
"s03":
  "f01": "Pour le secrétaire du CSE"
  "f02": "Gagner du temps sans perdre *la qualité des échanges*"
  "f03": "La rédaction du PV fait partie des missions structurantes du secrétariat du CSE. L'externaliser permet de réduire la charge administrative tout en conservant un processus de relecture et de validation par les personnes compétentes."
  "f04": "**Rigueur**Une restitution organisée et fidèle aux éléments transmis."
  "f05": "**Lisibilité**Des documents structurés pour faciliter la relecture et l'exploitation."
  "f06": "**Continuité**Une prestation qui peut accompagner les réunions et commissions tout au long de l'année."
  "f07": "**Confidentialité**Un traitement adapté à la sensibilité des échanges du CSE."
"s04":
  "f01": "CSE ZEN Assistance"
  "f02": "Libérez du temps après vos réunions."
  "f03": "Échangeons sur votre rythme de réunions, vos formats de PV et le niveau de restitution attendu."
  "f04": "Nous contacter →"
