"s03":
  "f01": "Un fonctionnement clair et *lisible*"
  "f02": "CSE ZEN privilégie une relation directe, un forfait préétabli, une utilisation illimitée et une absence d'engagement reconduit automatiquement."
  "f03": "**Forfait annuel préétabli**Le budget est fixé en début de relation."
  "f04": "**Utilisation illimitée**Les élus et représentants du personnel peuvent solliciter l'accompagnement sans décompte horaire."
  "f05": "**Bilan annuel**Le renouvellement repose sur la satisfaction et les résultats obtenus."
"s04":
  "f01": "Relier les pôles d’expertise aux sujets de terrain"
  "f02": "L’offre CSE ZEN s’appuie sur une logique de complémentarité : un sujet QVCT peut nécessiter un éclairage juridique, une analyse économique, une formation des élus et représentants du personnel, un outil de suivi et des supports de communication pour mobiliser les salariés. Les pages ressources permettent d’orienter rapidement les représentants du personnel vers les contenus associés aux sujets les plus fréquents : [QVCT](resource-tags/qvct.html), [RPS](resource-tags/rps.html) et [SSCT](resource-tags/ssct.html)."
