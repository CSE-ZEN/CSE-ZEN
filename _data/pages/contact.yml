"s03":
  "f01": "Dans quels cas contacter CSE ZEN ?"
  "f02": "Les élus CSE et représentants du personnel peuvent nous solliciter pour préparer une réunion importante, comprendre une consultation obligatoire, organiser une formation, obtenir un appui juridique ou économique, ou structurer une démarche de prévention sur les sujets de santé, sécurité et conditions de travail. L’objectif du premier échange est de qualifier rapidement le besoin : urgence, calendrier social, documents disponibles, niveau de risque et expertises à mobiliser."
  "f03": "Nous intervenons auprès de CSE de tailles différentes, avec une approche opérationnelle : rendre les obligations compréhensibles, aider les élus et représentants du personnel à poser les bonnes questions, sécuriser les étapes et transformer les sujets complexes en plan d’action. Vous pouvez aussi nous écrire pour un besoin de formation SSCT, de soutien sur les RPS, de préparation d’avis ou de mise en place d’un outil digital destiné aux représentants du personnel."
