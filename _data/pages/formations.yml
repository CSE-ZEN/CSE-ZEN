"s04":
  "f01": "Compléter la formation par des ressources pratiques"
  "f02": "Les formations CSE gagnent en efficacité lorsqu’elles sont reliées à des cas concrets rencontrés en réunion, en commission ou lors d’une alerte. Pour préparer un programme ou prolonger une session, les élus et représentants du personnel peuvent consulter nos dossiers sur la [santé, sécurité et conditions de travail](resource-tags/ssct.html), la [QVCT](resource-tags/qvct.html) et les [risques psychosociaux](resource-tags/rps.html). Ces ressources donnent des repères utiles avant de solliciter une formation SSCT, une formation économique ou un accompagnement plus ciblé."
