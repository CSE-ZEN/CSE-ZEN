# Espace d'édition CSE ZEN (Decap CMS) — accessible sur /admin/
# Fichier généré puis ajusté à la main : il définit ce que l'équipe CSE ZEN peut modifier.

backend:
  name: github
  repo: CSE-ZEN/CSE-ZEN
  branch: cms
  base_url: https://cse-zen-auth.broad-fog-84b6.workers.dev
locale: fr
publish_mode: simple
media_folder: assets/uploads
public_folder: /assets/uploads
site_url: https://www.cse-zen.com
display_url: https://www.cse-zen.com
logo_url: https://www.cse-zen.com/assets/logo-cse-zen.jpg
collections:
- name: articles
  label: Articles
  label_singular: article
  folder: _articles
  create: true
  extension: md
  format: frontmatter
  slug: '{{fields.title}}'
  summary: '{{title}} — {{date | date("DD/MM/YYYY")}}'
  sortable_fields:
  - date
  - title
  - categorie
  view_groups:
  - label: Catégorie
    field: categorie
  description: Les articles de la page Ressources. Un article publié apparaît automatiquement sur la page Ressources, dans
    le plan du site et dans le flux LinkedIn.
  fields:
  - label: Titre de l'article
    name: title
    widget: string
  - label: Chapô
    name: chapo
    widget: text
    hint: 2 ou 3 phrases sous le titre, qui résument l'article.
  - label: Catégorie
    name: categorie
    widget: select
    options:
    - label: QVCT
      value: qvct
    - label: RPS
      value: rps
    - label: SSCT
      value: ssct
    - label: Juridique
      value: juridique
    - label: Fonctionnement
      value: fonctionnement
    hint: Sert au filtre de la page Ressources.
  - label: Étiquette au-dessus du titre
    name: etiquette
    widget: string
    hint: 'Ex. : QVCT, Négociation, SSCT…'
  - label: Image à la une
    name: image
    widget: image
    required: false
    hint: Photo au format paysage, utilisée sur la carte et pour l'aperçu LinkedIn.
  - label: Texte de l'article
    name: body
    widget: markdown
    buttons:
    - bold
    - italic
    - link
    - heading-two
    - heading-three
    - bulleted-list
    - numbered-list
    - quote
    editor_components:
    - image
    - encadre
    - lien-externe
    hint: 'Utilisez « Titre 2 » pour les grandes parties : elles forment le sommaire « Dans cette page ».'
  - label: Date de publication
    name: date
    widget: datetime
    default: '{{now}}'
    format: YYYY-MM-DD HH:mm
    date_format: DD/MM/YYYY
    time_format: HH:mm
  - label: Type
    name: type
    widget: select
    default: article
    options:
    - label: Article (« Lire l'article »)
      value: article
    - label: Dossier (« Lire le dossier »)
      value: dossier
  - label: Visible sur le site
    name: published
    widget: boolean
    default: true
    required: false
    hint: Décochez pour garder l'article en brouillon (il n'apparaît nulle part sur le site).
  - label: À la une sur l'accueil
    name: a_la_une
    widget: boolean
    default: false
    required: false
  - label: Carte sur la page Ressources — titre
    name: carte_titre
    widget: string
    required: false
    hint: Laisser vide pour reprendre le titre de l'article.
  - label: Carte — résumé
    name: carte_resume
    widget: text
    required: false
    hint: Laisser vide pour reprendre le chapô.
  - label: Carte — étiquette
    name: carte_etiquette
    widget: string
    required: false
  - label: Carte — information 1
    name: carte_info_1
    widget: string
    required: false
    hint: 'Ex. : 5 min de lecture'
  - label: Carte — information 2
    name: carte_info_2
    widget: string
    required: false
    hint: 'Ex. : Pratique CSE'
  - label: Titre dans Google
    name: titre_google
    widget: string
    required: false
    hint: Environ 60 caractères. Laisser vide pour reprendre le titre.
  - label: Description dans Google et LinkedIn
    name: description
    widget: text
    hint: Environ 155 caractères.
  - label: Texte du post LinkedIn
    name: texte_linkedin
    widget: text
    required: false
    hint: Utilisé pour la publication automatique sur la page LinkedIn de CSE ZEN, si elle est activée. Sinon, la description
      ci-dessus est utilisée.
  - label: Sommaire — libellés courts
    name: sommaire
    widget: list
    required: false
    field:
      label: Libellé
      name: libelle
      widget: string
    hint: 'Facultatif. Un libellé par grande partie, dans l''ordre. Vide : les titres des parties sont repris tels quels.'
  - label: Pour aller plus loin
    name: articles_lies
    widget: list
    required: false
    summary: '{{fields.titre}}'
    fields:
    - label: Article
      name: page
      widget: relation
      collection: articles
      value_field: '{{slug}}'
      search_fields:
      - title
      display_fields:
      - title
    - label: Titre affiché
      name: titre
      widget: string
    - label: Phrase de présentation
      name: texte
      widget: string
  - label: Afficher le bloc « Continuer la lecture »
    name: continuer_lecture
    widget: boolean
    default: true
    required: false
  - label: llms_titre
    name: llms_titre
    widget: hidden
    required: false
  - label: llms_texte
    name: llms_texte
    widget: hidden
    required: false
